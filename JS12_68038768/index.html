<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>รหัสนักศึกษา 68038768 Satapon Supasueb</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <style>
        body { background-color: #f8f9fa; padding-top: 50px; }
        .card { max-width: 700px; margin: auto; box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
        #cake { width: 100%; height: auto; border-radius: 8px; }
    </style>
</head>
<body>

    <div class="container">
        <div class="card p-4 text-center">
            <h1 class="text-primary mb-4">การเปลี่ยนรูปภาพแบบสุ่ม</h1>

            <div class="mb-3">
                <img id="cake" src="cake1.jpg" alt="cake-image">
            </div>

            <p class="text-muted">
                Lorem ipsum, dolor sit amet consectetur adipisicing elit. Expedita, quam minus consequatur fuga sequi cum quibusdam sed vero debitis nisi.
            </p>

            <div class="mt-3">
                <input type="button" class="btn btn-warning" value="เปลี่ยนรูปเค้ก" onclick="changeSrc()">
            </div>
        </div>
    </div>

    <script>
        // สร้างตัวแปรเก็บชื่อไฟล์รูปภาพ 4 รูป
        const images = ["cake1.jpg", "cake2.jpg", "cake3.jpg", "cake4.jpg"];

        function changeSrc() {
            // สุ่มเลือก Index จาก 0 ถึง 3
            const randomIndex = Math.floor(Math.random() * images.length);
            
            // เปลี่ยน Attribute 'src' ของ element ที่มี id="cake"
            document.getElementById("cake").setAttribute("src", images[randomIndex]);
        }
    </script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
